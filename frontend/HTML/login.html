<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SmartAgri Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="login-page">
        <div class="row login-card bg-white g-0">
            <div class="col-lg-6 login-art">
                <div>
                    <div class="display-4 mb-3"><i class="bi bi-leaf"></i></div>
                    <h1 class="fw-bold">SmartAgri</h1>
                    <p class="lead">Manage Fertilizers. Track Inventory. Grow Smarter.</p>
                    <div class="mt-4 small">Fertilizer Sales & Inventory Management System</div>
                </div>
            </div>
            <div class="col-lg-6 p-5">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary">Login to SmartAgri</p>
                <form id="loginForm"><label class="form-label">Username / Email</label><input id="username"
                        class="form-control mb-3" required><label class="form-label">Password</label>
                    <div class="input-group mb-3"><input id="password" type="password" class="form-control"
                            required><button class="btn btn-outline-secondary" type="button" id="toggle"><i
                                class="bi bi-eye"></i></button></div>
                    <div class="d-flex justify-content-between mb-4"><label><input type="checkbox"> Remember
                            Me</label><a href="#" class="text-success">Forgot Password?</a></div><button
                        class="btn btn-success w-100 py-2" type="submit">Login <i
                            class="bi bi-box-arrow-in-right"></i></button>
                    <div id="msg" class="mt-3"></div>
                </form>
                <div class="small text-secondary mt-4 text-center">New to SmartAgri? <a href="registration.html" class="text-success fw-semibold text-decoration-none">Create an account</a></div>
            </div>
        </div>
    </div>
    <script src="../JS/config.js"></script>
    <script src="../JS/login.js"></script>
    <script src="../JS/i18n.js"></script>
</body>
</html>
