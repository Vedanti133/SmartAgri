<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track Consignment | SmartAgri</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SmartAgri Styles -->
    <link rel="stylesheet" href="../CSS/style2.css">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/ecommerce.css">
    <link rel="stylesheet" href="../CSS/responsive.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f7f4;
            color: #173f2f;
        }

        .tracking-card {
            background: #ffffff;
            border: 1px solid #e2ebe4;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Modern Progress Timeline */
        .timeline-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 2rem 0 1.5rem;
        }

        .timeline-steps::before {
            content: '';
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            height: 4px;
            background-color: #e0e7e1;
            z-index: 1;
        }

        .timeline-progress-bar {
            position: absolute;
            top: 24px;
            left: 24px;
            height: 4px;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            z-index: 2;
            transition: width 0.4s ease;
        }

        .timeline-step {
            position: relative;
            z-index: 3;
            text-align: center;
            flex: 1;
        }

        .timeline-node {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 3px solid #cedcd0;
            color: #8c9b90;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .timeline-step.completed .timeline-node {
            background-color: #2e7d32;
            border-color: #2e7d32;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(46, 125, 50, 0.3);
        }

        .timeline-step.active .timeline-node {
            background-color: #ffffff;
            border-color: #2e7d32;
            color: #2e7d32;
            box-shadow: 0 0 14px rgba(46, 125, 50, 0.4);
            animation: pulse-border 1.8s infinite;
        }

        @keyframes pulse-border {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .timeline-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #5d6f63;
        }

        .timeline-step.completed .timeline-label,
        .timeline-step.active .timeline-label {
            color: #173f2f;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .timeline-steps {
                flex-direction: column;
                gap: 1.5rem;
            }
            .timeline-steps::before {
                top: 24px;
                bottom: 24px;
                left: 24px;
                width: 4px;
                height: auto;
            }
            .timeline-step {
                display: flex;
                align-items: center;
                gap: 1rem;
                text-align: left;
            }
            .timeline-node {
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- CUSTOMER NAVBAR -->
    <nav class="customer-navbar py-2 px-3 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fs-4" href="customer-catalog.html">
                <i class="bi bi-flower1"></i>
                <span>Smart<strong>Agri</strong> Store</span>
            </a>

            <div class="d-flex align-items-center gap-2 gap-md-3">
                <a href="customer-catalog.html" class="customer-nav-link">
                    <i class="bi bi-grid-fill"></i>
                    <span class="d-none d-md-inline">Catalog</span>
                </a>

                <a href="customer-wishlist.html" class="customer-nav-link position-relative">
                    <i class="bi bi-heart fs-5"></i>
                    <span class="d-none d-md-inline">Wishlist</span>
                    <span id="wishlistCountBadge" class="nav-badge-count" style="display: none;">0</span>
                </a>

                <a href="customer-cart.html" class="customer-nav-link position-relative">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span class="d-none d-md-inline">Cart</span>
                    <span id="cartCountBadge" class="nav-badge-count" style="display: none;">0</span>
                </a>

                <a href="customer-orders.html" class="customer-nav-link">
                    <i class="bi bi-receipt fs-5"></i>
                    <span class="d-none d-md-inline">My Orders</span>
                </a>

                <a href="customer-order-tracking.html" class="customer-nav-link active">
                    <i class="bi bi-geo-alt-fill fs-5"></i>
                    <span class="d-none d-md-inline">Track Order</span>
                </a>

                <a href="returns.html" class="customer-nav-link">
                    <i class="bi bi-arrow-counterclockwise fs-5"></i>
                    <span class="d-none d-md-inline">Returns</span>
                </a>

                <a href="support.html" class="customer-nav-link">
                    <i class="bi bi-headset fs-5"></i>
                    <span class="d-none d-md-inline">Support</span>
                </a>

                <a href="customer-profile.html" class="customer-nav-link">
                    <i class="bi bi-person-circle fs-5"></i>
                    <span class="d-none d-md-inline" data-user-name>Account</span>
                </a>

                <button class="btn btn-outline-danger btn-sm ms-2" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-md-inline">Sign Out</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN TRACKING CONTAINER -->
    <main class="container px-3 px-md-4 mb-5" style="max-width: 950px;">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="customer-catalog.html" class="text-success text-decoration-none">Store</a></li>
                <li class="breadcrumb-item"><a href="customer-orders.html" class="text-success text-decoration-none">My Orders</a></li>
                <li class="breadcrumb-item active" aria-current="page">Consignment Tracking</li>
            </ol>
        </nav>

        <!-- ORDER SEARCH / LOOKUP IF NOT IN URL -->
        <div id="orderSearchCard" class="tracking-card mb-4" style="display: none;">
            <h5 class="fw-bold mb-2">Track Any Order</h5>
            <p class="text-muted small">Enter your order ID or tracking number to monitor live status.</p>
            <form id="trackingSearchForm" class="d-flex gap-2">
                <input type="text" id="trackingSearchInput" class="form-control" placeholder="e.g. Order ID 1, 2, or tracking number..." required>
                <button type="submit" class="btn btn-success px-4">Track</button>
            </form>
        </div>

        <div id="trackingContent">
            <div class="text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted">Retrieving consignment status...</p>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/auth.js"></script>
    <script src="../JS/config.js"></script>
    <script src="../JS/api.js"></script>
    <script src="../JS/utils.js"></script>
    <script src="../JS/customer-order-tracking.js"></script>
    <script src="../JS/i18n.js"></script>
</body>
</html>
