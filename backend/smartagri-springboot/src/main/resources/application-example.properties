# ==============================================================================
# SmartAgri — Example Application Configuration Template
# Copy this file to application.properties and customize for your environment.
# DO NOT COMMIT REAL PRODUCTION SECRETS TO VERSION CONTROL.
# ==============================================================================

# Database Connection Settings
# DB_HOST: Hostname of your MySQL instance (default: localhost)
# DB_PORT: Port number of your MySQL instance (default: 3306)
# DB_NAME: Database name (default: smartagri)
# DB_USERNAME: Database username (e.g., root)
# DB_PASSWORD: Database password (leave empty if no password is set)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartagri}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Mode
# Options: 'update' (auto-create/update tables), 'validate', 'none'
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server Port (default 8080)
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Cross-Origin Resource Sharing (CORS)
# Add your frontend origins separated by commas
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000,http://localhost:8080,http://127.0.0.1:8080}

# JWT Token Configuration
# Minimum 32-character secret key for HMAC-SHA256 signature
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# GST & Invoice Seller Details
smartagri.invoice.seller-name=SmartAgri Technologies Pvt. Ltd.
smartagri.invoice.seller-gstin=27AABCS1429B1Z8
smartagri.invoice.seller-address=Plot 104, Agro Tech Hub, Hinjawadi Phase 1, Pune, Maharashtra 411057
smartagri.invoice.seller-state=Maharashtra

# Payment Gateway Configuration (Test Mode Fallback)
smartagri.payment.key-id=${PAYMENT_KEY_ID:mock_test_key_id}
smartagri.payment.key-secret=${PAYMENT_KEY_SECRET:mock_test_secret}
